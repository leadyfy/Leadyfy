<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadyfy CRM Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>Leadyfy</h2>

    <ul>
        <li>🏠 Dashboard</li>
        <li>👥 Leads</li>
        <li>📞 Follow Up</li>
        <li>💰 Loans</li>
        <li>📊 Reports</li>
        <li>⚙ Settings</li>
    </ul>
</div>

<div class="main">

    <h1>Dashboard</h1>

    <div class="cards">

        <div class="card">
            <h2 id="totalLeads">150</h2>
            <p>Total Leads</p>
        </div>

        <div class="card">
            <h2 id="todayLeads">38</h2>
            <p>Today's Leads</p>
        </div>

        <div class="card">
            <h2 id="followUps">25</h2>
            <p>Follow Ups</p>
        </div>

        <div class="card">
            <h2 id="approvedLoans">12</h2>
            <p>Approved Loans</p>
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
