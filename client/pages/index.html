<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leadyfy CRM Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="sidebar">

    <h2>Leadyfy</h2>

    <ul>
        <li><a href="index.html">🏠 Dashboard</a></li>
        <li><a href="leads.html">👥 Leads</a></li>
        <li><a href="followup.html">📞 Follow Up</a></li>
        <li><a href="loans.html">💰 Loans</a></li>
        <li><a href="reports.html">📊 Reports</a></li>
        <li><a href="settings.html">⚙ Settings</a></li>
    </ul>

</div>

<div class="main">

    <h1>Dashboard</h1>

    <button id="addLeadBtn">+ Add Lead</button>

    <div class="cards">

        <div class="card">
            <h2 id="totalLeads">150</h2>
            <p>Total Leads</p>
        </div>

        <div class="card">
            <h2 id="todayLeads">38</h2>
            <p>Today's Leads</p>
        </div>

        <div class="card">
            <h2 id="followUps">25</h2>
            <p>Follow Ups</p>
        </div>

        <div class="card">
            <h2 id="approvedLoans">12</h2>
            <p>Approved Loans</p>
        </div>

    </div>

</div>

<!-- Popup -->

<div id="leadPopup" class="popup">

    <div class="popup-content">

        <span id="closePopup">&times;</span>

        <h2>Add New Lead</h2>

        <input type="text" id="customerName" placeholder="Customer Name">

        <input type="text" id="mobileNumber" placeholder="Mobile Number">

        <input type="text" id="loanType" placeholder="Loan Type">

        <input type="number" id="loanAmount" placeholder="Loan Amount">

        <p id="errorMessage"></p>

        <button id="saveLeadBtn">Save Lead</button>

    </div>

</div>

<script src="../js/script.js"></script>

</body>
</html>
